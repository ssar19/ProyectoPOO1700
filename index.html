<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NombrePagina</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/ae7d97b31c.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav id="barra" class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand">NombrePagina</a>
            <form class="d-flex" role="search">
            <input id="buscador" class="form-control me-2" type="search" placeholder="Buscar en NombrePagina" aria-label="Search"/>
            </form>
            <i class="fa-regular fa-circle-question"></i>
            <i class="fa-solid fa-gear"></i>
            <i class="fa-solid fa-table-cells"></i>
            <i class="fa-regular fa-user"></i>
        </div>
    </nav>
    <aside id="barra-lateral">
        <div id="boton-nuevo">
            <i class="fa-solid fa-plus"></i>
            Nuevo
        </div>
        <br>
        <div>
            <i class="fa-solid fa-house"></i>
            Menú principal 
        </div>
        <div>
            <i class="fa-regular fa-floppy-disk"></i>
            Mi unidad
        </div>
        <div>
            <i class="fa-solid fa-computer"></i>
            Computadoras
        </div>
        <br>
        <div>
            <i class="fa-solid fa-people-group"></i>
            Compartidos conmigo
        </div>
        <div>
            <i class="fa-regular fa-clock"></i>
            Recientes
        </div>
        <div>
            <i class="fa-regular fa-star"></i>
            Destacados
        </div>
        <br>
        <div>
            <i class="fa-solid fa-ban"></i>
            Spam
        </div>
        <div>
            <i class="fa-solid fa-trash"></i>
            Papelera
        </div>
        <div>
            <i class="fa-regular fa-cloud"></i>
            Almacenamiento
        </div>
        <br>
        <div>
            1.0 Gb de almacenamiento de 15Gb utilizado(s)
        </div>
        <br>
        <button id="boton-almacenamiento">Obtener más almacenamiento</button>
    </aside>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
    
</body>
</html>
